name: CI Test & Multi-Agent Verification

on:
  push:
    branches: [ main, master, kashish-dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite
        run: |
          python tests/test_system.py

      - name: Run Multi-Agent Smoke Benchmark
        run: |
          python graph.py datasets/raw/sample.csv "predict whether tumor is malignant based on measurements"

